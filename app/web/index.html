<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MChart — MbuniTech communication & task workspace">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MChart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MChart</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script type="module">
    // Some hardened browsers block Flutter's engine from importing the CanvasKit
    // ES module (Trusted Types). Preload it and hand the ready instance to the
    // engine so it skips its own loader.
    (async () => {
      const base = document.querySelector('base')?.getAttribute('href') || '/';
      try {
        const ck = await import(base + 'canvaskit/canvaskit.js');
        window.flutterCanvasKit = await ck.default({
          locateFile: (file) => base + 'canvaskit/' + file,
        });
      } catch (e) {
        console.warn('CanvasKit preload skipped:', e);
      } finally {
        const s = document.createElement('script');
        s.src = base + 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
