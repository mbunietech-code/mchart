<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MChart — MbuniTech communication & task workspace">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MChart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MChart</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // A previous deploy shipped flutter_service_worker.js, which some
    // visitors' browsers registered and are still running. That old worker
    // can keep serving cached copies of index.html/main.dart.js from before
    // this deploy, or fail to update now that the file is gone — either way
    // the app looks stuck. Unregister it and clear its caches once, then
    // reload, so every visitor lands on a clean, current page.
    (function () {
      if (!('serviceWorker' in navigator) || sessionStorage.getItem('mchart-sw-cleared')) return;
      sessionStorage.setItem('mchart-sw-cleared', '1');
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            return 'caches' in window
              ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
              : null;
          })
          .then(function () { location.reload(); });
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
